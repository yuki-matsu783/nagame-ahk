<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>調査結果: canvas形式HTML生成スキル（リッチ表現版デモ）</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'media',
    theme: {
      extend: {
        keyframes: {
          dash: { to: { strokeDashoffset: -32 } },
        },
      },
    },
  }
</script>
<style>
  .canvas-bg {
    background-image: radial-gradient(circle, rgba(148,163,184,0.35) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .node-hex {
    clip-path: polygon(14% 0%, 86% 0%, 100% 50%, 86% 100%, 14% 100%, 0% 50%);
  }
</style>
</head>
<body class="m-0 bg-slate-950 text-slate-100 font-sans overflow-hidden">

  <header class="fixed top-0 inset-x-0 z-20 flex flex-wrap items-center justify-between gap-2 px-6 py-3
                  bg-slate-950/80 backdrop-blur border-b border-slate-800">
    <div>
      <p class="text-[0.68rem] font-bold uppercase tracking-widest text-slate-500">issue #58 調査結果</p>
      <h1 class="text-base font-semibold text-slate-100">nagame-ahk features/lib 依存関係キャンバス（リッチ表現デモ）</h1>
    </div>
    <p class="hidden md:block text-xs text-slate-500">ホイールでズーム ・ ドラッグでパン ・ ノードにカーソルで関連をハイライト</p>
  </header>

  <div id="viewport" class="canvas-bg absolute inset-0 pt-16 cursor-grab active:cursor-grabbing">
    <div id="world" class="relative origin-top-left" style="width:1700px;height:1000px;">
      <svg id="edges" class="absolute inset-0 pointer-events-none" width="1700" height="1000">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" class="fill-slate-400"></path>
          </marker>
        </defs>
      </svg>
      <div id="clusters" class="absolute inset-0"></div>
      <div id="nodes" class="absolute inset-0"></div>
    </div>
  </div>

  <div class="fixed bottom-6 right-6 z-20 flex flex-col gap-2">
    <button id="zoom-in"  class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-lg leading-none">+</button>
    <button id="zoom-out" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-lg leading-none">−</button>
    <button id="zoom-reset" class="w-9 h-9 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-[0.65rem]">FIT</button>
  </div>

  <div class="fixed bottom-6 left-6 z-20 rounded-xl border border-slate-800 bg-slate-900/90 backdrop-blur px-4 py-3 text-[0.7rem] space-y-2 shadow-xl max-w-[220px]">
    <div>
      <p class="font-semibold text-slate-300 mb-1">ノード（形状・アイコンで種別を表現）</p>
      <p class="flex items-center gap-2"><span class="w-3 h-3 rounded bg-emerald-400"></span>⚡ features/（角丸四角）</p>
      <p class="flex items-center gap-2"><span class="w-3 h-3 bg-sky-400" style="clip-path:polygon(20% 0,80% 0,100% 50%,80% 100%,20% 100%,0 50%)"></span>🧩 lib/（六角形）</p>
      <p class="text-slate-500 mt-1">サイズ＝呼ばれている数（ハブ度）</p>
    </div>
    <div class="border-t border-slate-800 pt-2">
      <p class="font-semibold text-slate-300 mb-1">エッジ（用途ごとに色・線種）</p>
      <p class="flex items-center gap-2"><span class="w-4 border-t-2 border-slate-400"></span>ログ出力</p>
      <p class="flex items-center gap-2"><span class="w-4 border-t-2 border-amber-400"></span>JSON変換</p>
      <p class="flex items-center gap-2"><span class="w-4 border-t-2 border-indigo-400"></span>ウィンドウ操作</p>
      <p class="flex items-center gap-2"><span class="w-4 border-t-2 border-cyan-400"></span>IPC通信</p>
      <p class="flex items-center gap-2"><span class="w-4 border-t-2 border-dashed border-rose-400"></span>ウィンドウ監視イベント</p>
      <p class="flex items-center gap-2"><span class="w-4 border-t-2 border-dashed border-violet-400"></span>ファイル監視通知</p>
    </div>
  </div>

<script>
  // ---- データ定義: nagame-ahk実コード（src/）の #Include・関数呼び出しから抽出した実関係 ----
  // group: 'feature' | 'lib'（ノードの形状・色を決める）
  // uses: 数値が大きいほど多くの箇所から使われる = ハブとしてノードを大きく表示する
  const NODES = [
    // --- src/features/ ---
    { id: 'ActivityStatus',    group: 'feature', x: 220,  y: 210, label: 'ActivityStatus.ahk',    desc: '対応工数の稼働状態を記録' },
    { id: 'ClipboardControl',  group: 'feature', x: 560,  y: 210, label: 'ClipboardControl.ahk',  desc: 'クリップボード操作' },
    { id: 'InputControl',      group: 'feature', x: 900,  y: 210, label: 'InputControl.ahk',      desc: 'キー・マウス入力制御' },
    { id: 'NotifyUI',          group: 'feature', x: 1240, y: 210, label: 'NotifyUI.ahk',          desc: '通知UI表示' },
    { id: 'OfficeFileWatcher', group: 'feature', x: 220,  y: 460, label: 'OfficeFileWatcher.ahk', desc: 'Office文書オープン監視' },
    { id: 'PdfFileWatcher',    group: 'feature', x: 560,  y: 460, label: 'PdfFileWatcher.ahk',    desc: 'PDFオープン監視' },
    { id: 'RecentDocsWatcher', group: 'feature', x: 900,  y: 460, label: 'RecentDocsWatcher.ahk', desc: '最近使ったファイル監視' },
    { id: 'WindowControl',     group: 'feature', x: 1240, y: 460, label: 'WindowControl.ahk',     desc: 'ウィンドウ配置操作' },
    // --- src/lib/ ---
    { id: 'Logger',            group: 'lib', x: 900,  y: 840, label: 'Logger.ahk',            desc: 'ログ出力（最多参照のハブ）' },
    { id: 'Json',              group: 'lib', x: 540,  y: 840, label: 'Json.ahk',              desc: 'JSONエンコード/デコード' },
    { id: 'WindowUtils',       group: 'lib', x: 340,  y: 840, label: 'WindowUtils.ahk',       desc: 'ウィンドウ状態取得' },
    { id: 'TcpServer',         group: 'lib', x: 1240, y: 840, label: 'TcpServer.ahk',         desc: '外部コマンドサーバー' },
    { id: 'WindowOpenWatcher', group: 'lib', x: 1060, y: 840, label: 'WindowOpenWatcher.ahk', desc: 'ウィンドウ表示イベント監視' },
    { id: 'FileOpenNotifier',  group: 'lib', x: 700,  y: 840, label: 'FileOpenNotifier.ahk',  desc: 'ファイルオープン通知の共通処理' },
  ];

  // category: エッジの色・線種を決める「関係の種類」
  const EDGES = [
    { from: 'ActivityStatus',    to: 'Logger',            category: 'log' },
    { from: 'ClipboardControl',  to: 'Logger',            category: 'log' },
    { from: 'InputControl',      to: 'Logger',            category: 'log' },
    { from: 'NotifyUI',          to: 'Json',              category: 'json' },
    { from: 'OfficeFileWatcher', to: 'Logger',            category: 'log' },
    { from: 'OfficeFileWatcher', to: 'TcpServer',         category: 'ipc' },
    { from: 'OfficeFileWatcher', to: 'WindowOpenWatcher',  category: 'watch' },
    { from: 'OfficeFileWatcher', to: 'FileOpenNotifier',   category: 'notify' },
    { from: 'PdfFileWatcher',    to: 'Logger',            category: 'log' },
    { from: 'PdfFileWatcher',    to: 'WindowOpenWatcher',  category: 'watch' },
    { from: 'PdfFileWatcher',    to: 'FileOpenNotifier',   category: 'notify' },
    { from: 'RecentDocsWatcher', to: 'Logger',            category: 'log' },
    { from: 'RecentDocsWatcher', to: 'Json',              category: 'json' },
    { from: 'RecentDocsWatcher', to: 'WindowOpenWatcher',  category: 'watch' },
    { from: 'RecentDocsWatcher', to: 'FileOpenNotifier',   category: 'notify' },
    { from: 'WindowControl',     to: 'Logger',            category: 'log' },
    { from: 'WindowControl',     to: 'WindowUtils',       category: 'winutil' },
    { from: 'FileOpenNotifier',  to: 'Json',              category: 'json' },
    { from: 'WindowOpenWatcher',  to: 'Logger',            category: 'log' },
    { from: 'TcpServer',         to: 'Logger',            category: 'log' },
    { from: 'WindowUtils',       to: 'Json',              category: 'json' },
  ];

  const GROUP_STYLE = {
    feature: { shapeClass: 'rounded-xl', icon: '⚡', bar: 'bg-gradient-to-r from-emerald-400 to-emerald-600', card: 'border-emerald-400/40 hover:ring-emerald-400/60' },
    lib:     { shapeClass: 'node-hex',   icon: '🧩', bar: 'bg-gradient-to-r from-sky-400 to-sky-600',       card: 'border-sky-400/40 hover:ring-sky-400/60' },
  };

  // エッジの見た目（色・破線・太さ）。用途カテゴリごとに変える＝「関係の種類」を視覚化する
  const EDGE_STYLE = {
    log:     { stroke: '#94a3b8', dash: null,    width: 1.5, label: 'ログ出力' },
    json:    { stroke: '#fbbf24', dash: null,    width: 1.5, label: 'JSON変換' },
    winutil: { stroke: '#818cf8', dash: null,    width: 1.5, label: 'ウィンドウ操作' },
    ipc:     { stroke: '#22d3ee', dash: null,    width: 2.5, label: 'IPC通信' },
    watch:   { stroke: '#fb7185', dash: '5 5',   width: 1.5, label: 'ウィンドウ監視イベント' },
    notify:  { stroke: '#a78bfa', dash: '5 5',   width: 1.5, label: 'ファイル監視通知' },
  };

  const nodesLayer = document.getElementById('nodes');
  const clustersLayer = document.getElementById('clusters');
  const svg = document.getElementById('edges');
  const byId = Object.fromEntries(NODES.map(n => [n.id, n]));

  // ハブ度（他ノードから何回参照されているか）でノードサイズを決める
  const inDegree = Object.fromEntries(NODES.map(n => [n.id, 0]));
  EDGES.forEach(e => { inDegree[e.to] = (inDegree[e.to] || 0) + 1; });
  function sizeFor(id) {
    const d = inDegree[id] || 0;
    if (d >= 8) return { w: 168, pad: 'px-5 py-4', font: 'text-sm' };
    if (d >= 3) return { w: 148, pad: 'px-4 py-3', font: 'text-[0.8rem]' };
    return { w: 132, pad: 'px-3.5 py-2.5', font: 'text-[0.75rem]' };
  }

  // ---- クラスタ背景（features/ と lib/ をグルーピングして囲む） ----
  function drawCluster(groupId, label, color) {
    const members = NODES.filter(n => n.group === groupId);
    const pad = 60;
    const xs = members.map(n => n.x), ys = members.map(n => n.y);
    const x0 = Math.min(...xs) - pad, x1 = Math.max(...xs) + pad;
    const y0 = Math.min(...ys) - pad, y1 = Math.max(...ys) + pad;
    const box = document.createElement('div');
    box.className = `absolute rounded-3xl border border-dashed ${color.border} ${color.bg}`;
    box.style.left = x0 + 'px';
    box.style.top = y0 + 'px';
    box.style.width = (x1 - x0) + 'px';
    box.style.height = (y1 - y0) + 'px';
    box.innerHTML = `<span class="absolute -top-3 left-4 px-2 text-[0.65rem] font-bold tracking-wide ${color.text} bg-slate-950 rounded">${label}</span>`;
    clustersLayer.appendChild(box);
  }
  drawCluster('feature', 'src/features/', { border: 'border-emerald-500/30', bg: 'bg-emerald-500/5', text: 'text-emerald-300' });
  drawCluster('lib', 'src/lib/', { border: 'border-sky-500/30', bg: 'bg-sky-500/5', text: 'text-sky-300' });

  // ---- ノード描画 ----
  NODES.forEach(n => {
    const s = GROUP_STYLE[n.group];
    const sz = sizeFor(n.id);
    const el = document.createElement('div');
    el.dataset.id = n.id;
    el.style.left = n.x + 'px';
    el.style.top = n.y + 'px';
    el.style.width = sz.w + 'px';
    el.className = `node absolute -translate-x-1/2 -translate-y-1/2 border ${s.card} ${s.shapeClass}
      bg-slate-900/95 backdrop-blur ${sz.pad} shadow-lg shadow-black/30 ring-2 ring-transparent
      transition-all duration-200 cursor-pointer select-none text-center`;
    el.innerHTML = `
      <div class="h-1 w-6 mx-auto rounded-full ${s.bar} mb-1.5"></div>
      <div class="${sz.font} font-semibold text-slate-100">${s.icon} ${n.label}</div>
      <div class="text-[0.62rem] text-slate-400 mt-0.5 leading-snug">${n.desc}</div>
      ${inDegree[n.id] >= 3 ? `<div class="text-[0.6rem] text-slate-500 mt-1">被参照 ${inDegree[n.id]}件</div>` : ''}
    `;
    nodesLayer.appendChild(el);
  });

  // ---- エッジ描画 ----
  function edgePath(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const dist = Math.hypot(dx, dy) || 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const offset = Math.min(36, dist * 0.12);
    const ux = -dy / dist, uy = dx / dist;
    return { d: `M ${a.x},${a.y} Q ${mx + ux * offset},${my + uy * offset} ${b.x},${b.y}`, mx: mx + ux * offset, my: my + uy * offset };
  }

  EDGES.forEach(e => {
    const a = byId[e.from], b = byId[e.to];
    const style = EDGE_STYLE[e.category];
    const { d, mx, my } = edgePath(a, b);

    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', d);
    path.setAttribute('marker-end', 'url(#arrow)');
    if (style.dash) path.setAttribute('stroke-dasharray', style.dash);
    path.dataset.from = e.from;
    path.dataset.to = e.to;
    path.dataset.baseStroke = style.stroke;
    path.setAttribute('class', 'fill-none opacity-60 transition-all duration-200 animate-[dash_1.6s_linear_infinite]');
    path.style.stroke = style.stroke;
    path.style.strokeWidth = style.width;
    svg.appendChild(path);
  });

  // ---- ホバーで関連ノード・エッジをハイライト ----
  const allNodeEls = document.querySelectorAll('.node');
  const allPathEls = svg.querySelectorAll('path');

  function setHighlight(id) {
    if (!id) {
      allNodeEls.forEach(el => el.classList.remove('opacity-35', 'ring-fuchsia-400'));
      allPathEls.forEach(p => { p.classList.remove('opacity-100'); p.classList.add('opacity-60'); p.style.stroke = p.dataset.baseStroke; });
      return;
    }
    allNodeEls.forEach(el => {
      const related = el.dataset.id === id ||
        EDGES.some(e => (e.from === id && e.to === el.dataset.id) || (e.to === id && e.from === el.dataset.id));
      el.classList.toggle('opacity-35', !related);
      el.classList.toggle('ring-fuchsia-400', related && el.dataset.id !== id);
    });
    allPathEls.forEach(p => {
      const related = p.dataset.from === id || p.dataset.to === id;
      p.classList.toggle('opacity-100', related);
      p.classList.toggle('opacity-60', !related);
      p.style.stroke = related ? '#e879f9' : p.dataset.baseStroke;
    });
  }
  allNodeEls.forEach(el => {
    el.addEventListener('mouseenter', () => setHighlight(el.dataset.id));
    el.addEventListener('mouseleave', () => setHighlight(null));
  });

  // ---- パン & ズーム ----
  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  let scale = 0.62, panX = 60, panY = 30;
  let dragging = false, lastX = 0, lastY = 0;
  function applyTransform() { world.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`; }
  applyTransform();

  viewport.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    const rect = viewport.getBoundingClientRect();
    const mouseX = ev.clientX - rect.left, mouseY = ev.clientY - rect.top;
    const prevScale = scale;
    scale = Math.min(2.2, Math.max(0.3, scale * (ev.deltaY < 0 ? 1.1 : 0.9)));
    panX = mouseX - (mouseX - panX) * (scale / prevScale);
    panY = mouseY - (mouseY - panY) * (scale / prevScale);
    applyTransform();
  }, { passive: false });

  viewport.addEventListener('mousedown', (ev) => { dragging = true; lastX = ev.clientX; lastY = ev.clientY; });
  window.addEventListener('mousemove', (ev) => {
    if (!dragging) return;
    panX += ev.clientX - lastX; panY += ev.clientY - lastY;
    lastX = ev.clientX; lastY = ev.clientY;
    applyTransform();
  });
  window.addEventListener('mouseup', () => dragging = false);

  document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(2.2, scale * 1.2); applyTransform(); });
  document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.3, scale * 0.8); applyTransform(); });
  document.getElementById('zoom-reset').addEventListener('click', () => { scale = 0.62; panX = 60; panY = 30; applyTransform(); });
</script>

</body>
</html>
